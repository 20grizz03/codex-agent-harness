name: agent-harness
version: 2
description: Короткая OpenSpec-декомпозиция перед выполнением через Agent Harness
artifacts:
  - id: proposal
    generates: proposal.md
    description: Цель, область и влияние изменения
    template: proposal.md
    instruction: |
      Пиши кратко и естественно по-русски. Зафиксируй зачем нужно изменение,
      что меняется, что не входит в работу, затронутые capabilities и системы.
      Открытые вопросы указывай явно; не подменяй неизвестное предположением.
      Сохраняй служебные заголовки Capabilities на английском, потому что их
      читает OpenSpec. Детали реализации оставь для design.md.
    requires: []

  - id: specs
    generates: "specs/**/*.md"
    description: Проверяемый контракт поведения
    template: spec.md
    instruction: |
      Опиши наблюдаемое поведение, входы, результаты, ошибки и внешние
      ограничения. Не указывай внутренние классы, функции и порядок написания
      кода. Сохраняй обязательные заголовки OpenSpec и слова MUST, WHEN, THEN.
      Используй ADDED, MODIFIED, REMOVED или RENAMED Requirements; для MODIFIED
      переноси полное требование, а для REMOVED указывай Reason и Migration.
      У новой capability заполни Purpose, у каждого требования должен быть хотя
      бы один проверяемый Scenario.
      Для применимых рисков отдельно зафиксируй состояния и ошибки,
      безопасность/PII, повторные попытки и восстановление, совместимость,
      эксплуатационное включение и источник UI-макетов или ассетов.
    requires:
      - proposal

  - id: design
    generates: design.md
    description: Существенные технические решения и риски
    template: design.md
    instruction: |
      Раздел Decomposition Readiness заполняй всегда и до tasks.md. Остальной
      содержательный design нужен для межсервисного изменения, новой
      зависимости, модели данных, миграции, безопасности или решения с
      реальными альтернативами. Объясняй причины выбора и границы. Не повторяй
      proposal и specs. Всегда заполни разделы Security and Data, Failure and
      Recovery, Operability, Compatibility и UI and Source Material; для
      неприменимого раздела укажи короткую проверяемую причину.
    requires:
      - proposal

  - id: tasks
    generates: tasks.md
    description: Согласуемая декомпозиция для Agent Harness
    template: tasks.md
    instruction: |
      До implementation-задач перенеси из design.md статус Decomposition
      Readiness и основания: компоненты, контракты, состояния и ошибки,
      восстановление, порядок внедрения, совместимость, границы публикации и
      отката. При analysis_required оставь только analysis/spike с проверяемым
      результатом и не создавай приблизительную implementation-декомпозицию.
      Сделай один checkbox на самостоятельную задачу Agent Harness. Расположи
      задачи по зависимостям и дели их по законченному поведению, а не по слоям
      или файлам. Для каждой укажи наблюдаемый результат, endpoints или функции,
      границы, ожидаемый объём рабочего кода, отдельный объём тестов, Jira, PR,
      стратегию публикации и способ проверки. Ориентир — 300–700 строк рабочего
      кода без нижнего ограничения; превышение допустимо для связного среза с
      конкретным объяснением невозможности безопасного разделения.
      Перед показом плана проверь, что в каждом implementation-пункте ровно
      один наблюдаемый результат и нет другого поведения, которое можно
      безопасно собрать, проверить, опубликовать и откатить отдельно.
      Не добавляй рекомендации к тестированию после
      реализации: их сформирует delivery-writing по фактическому diff.
      Первым пунктом добавь проверку фактической доступности зависимостей без
      требования VPN или другого конкретного способа доступа. Для двух и более
      задач одного репозитория последним пунктом добавь общий интеграционный run
      в режиме report_only; он не является отдельным PR.
    requires:
      - specs
      - design

apply:
  requires: [tasks]
  tracks: tasks.md
  instruction: |
    Не выполняй пункты напрямую. Передай декомпозицию в epic-workflow: каждый
    пункт реализации получает отдельный run Agent Harness, проверки и ревью.
    Отмечай checkbox только после terminal complete соответствующего run.
    После всех пунктов добавь в кампанию служебный финализационный run без
    собственного checkbox: он проверяет и архивирует change.
